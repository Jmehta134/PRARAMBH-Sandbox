name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags (e.g., v1.0.3)

permissions:
  contents: write # Allows committing version.json and creating releases

jobs:
  update-manifest:
    name: Auto-Update version.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate New version.json
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          cat <<EOF > version.json
          {
            "version": "$VERSION",
            "download_url_windows": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sandbox_${{ github.ref_name }}_windows.zip",
            "download_url_linux": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sandbox_${{ github.ref_name }}_linux.zip"
          }
          EOF

      - name: Commit and Push to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Auto-update version.json for ${{ github.ref_name }}" || echo "No changes to commit"
          git push origin main

  build-and-release:
    needs: update-manifest
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            installer_bin: Installer.exe
            sandbox_zip: sandbox_${{ github.ref_name }}_windows.zip
          - os: ubuntu-22.04
            installer_bin: Installer
            sandbox_zip: sandbox_${{ github.ref_name }}_linux.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libxcb-xinerama0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 requests pyinstaller Pillow

      - name: Build Windows Packages
        if: matrix.os == 'windows-latest'
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.ico')"
          
          # Build Installer
          pyinstaller --noconfirm --onefile --windowed --icon="assets\icon.ico" --name "Installer" launcher.py
          
          # Build Core Sandbox
          pyinstaller --noconfirm --onedir --windowed --icon="assets\icon.ico" --name "Sandbox" --add-data "examples;examples" --add-data "bin;bin" --add-data "assets\icon.png;." src\main.py
          
          # Compress Sandbox direct contents into zip
          Compress-Archive -Path "dist\Sandbox\*" -DestinationPath "${{ matrix.sandbox_zip }}" -Force

      - name: Build Linux Packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Build Installer
          pyinstaller --noconfirm --onefile --windowed --icon="assets/icon.png" --name "Installer" launcher.py
          
          # Build Core Sandbox
          pyinstaller --noconfirm --onedir --name "Sandbox" --hidden-import=pkgutil --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtWidgets --add-data "examples:examples" --add-data "bin:bin" --add-data "assets/icon.png:." src/main.py
          
          # Make binaries executable inside build
          find dist/Sandbox -type f \( -name "Sandbox" -o -name "iverilog" -o -name "vvp" -o -name "ivl" -o -name "ivlpp" \) -exec chmod +x {} +
          
          # Compress Sandbox direct contents into zip
          cd dist/Sandbox
          zip -r ../../${{ matrix.sandbox_zip }} .
          cd ../..

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.installer_bin }}
            ${{ matrix.sandbox_zip }}