name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            installer_bin: Installer.exe
            sandbox_zip: sandbox_${{ github.ref_name }}_windows.zip
          - os: ubuntu-22.04
            installer_bin: Installer
            sandbox_zip: sandbox_${{ github.ref_name }}_linux.zip

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip libxcb-xinerama0 libegl1 libgl1-mesa-glx libdbus-1-3 libxkbcommon-x11-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt5 PyQtWebEngine requests pyinstaller pyverilog Pillow

      - name: Update version.json locally before build
        run: |
          python -c "
          import json, os
          ver = '${{ github.ref_name }}'.lstrip('v')
          data = {
              'version': ver,
              'download_url_windows': f'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sandbox_${{ github.ref_name }}_windows.zip',
              'download_url_linux': f'https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/sandbox_${{ github.ref_name }}_linux.zip'
          }
          with open('version.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

      - name: Build Windows Packages
        if: matrix.os == 'windows-latest'
        run: |
          python -c "from PIL import Image; Image.open('assets/icon.png').save('assets/icon.ico')"
          
          # Build Installer
          pyinstaller --noconfirm --onefile --windowed --icon="assets\icon.ico" --name "Installer" launcher.py
          
          # Build Core Sandbox
          pyinstaller --noconfirm --onedir --windowed --icon="assets\icon.ico" --name "Sandbox" --hidden-import=PyQt5.QtWebEngineWidgets --hidden-import=PyQt5.QtWebEngineCore --hidden-import=PyQt5.QtNetwork --collect-data pyverilog --copy-metadata pyverilog --exclude-module PyQt5.QtSql --exclude-module PyQt5.QtBluetooth --exclude-module PyQt5.QtMultimedia --exclude-module PyQt5.QtSensors --exclude-module PyQt5.QtTest --exclude-module PyQt5.QtXml --add-data "examples;examples" --add-data "bin;bin" --add-data "assets;assets" --add-data "version.json;." src\main.py
          
          # Compress Sandbox direct contents into zip
          Compress-Archive -Path "dist\Sandbox\*" -DestinationPath "${{ matrix.sandbox_zip }}" -Force

      - name: Build Linux Packages
        if: matrix.os == 'ubuntu-22.04'
        run: |
          # Build Installer
          pyinstaller --noconfirm --onefile --windowed --icon="assets/icon.png" --name "Installer" launcher.py
          
          # Build Core Sandbox
          pyinstaller --noconfirm --onedir --name "Sandbox" --hidden-import=pkgutil --hidden-import=PyQt5.QtCore --hidden-import=PyQt5.QtWidgets --hidden-import=PyQt5.QtWebEngineWidgets --hidden-import=PyQt5.QtWebEngineCore --hidden-import=PyQt5.QtNetwork --collect-data pyverilog --copy-metadata pyverilog --exclude-module PyQt5.QtSql --exclude-module PyQt5.QtBluetooth --exclude-module PyQt5.QtMultimedia --exclude-module PyQt5.QtSensors --exclude-module PyQt5.QtTest --exclude-module PyQt5.QtXml --add-data "examples:examples" --add-data "bin:bin" --add-data "assets:assets" --add-data "version.json:." src/main.py
          
          # Make all bundled binaries executable (including Yosys and Node.js)
          find dist/Sandbox -type f \( -name "Sandbox" -o -name "iverilog" -o -name "vvp" -o -name "ivl" -o -name "ivlpp" -o -name "yosys" -o -name "node" \) -exec chmod +x {} +
          
          # Compress Sandbox direct contents into zip
          cd dist/Sandbox
          zip -r ../../${{ matrix.sandbox_zip }} .
          cd ../..

      - name: Upload Binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.installer_bin }}
            ${{ matrix.sandbox_zip }}